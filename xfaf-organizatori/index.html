<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xFAF: Organizer</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2314182C'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='%23CE3327'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Archivo:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --stock: #F2EDE1;
    --stock-2: #E6DECA;
    --ink: #14182C;
    --ink-2: #1D2340;
    --ink-3: #0D1020;
    --vermilion: #CE3327;
    --vermilion-d: #A62A21;
    --brass: #B08F4F;
    --brass-lt: #D8B876;
    --on-ink-dim: #B9B2A0;
    --on-stock-dim: #5C5847;
    --serif: 'Bodoni Moda', 'Didot', Georgia, serif;
    --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--stock);
    font-family: var(--sans);
    font-optical-sizing: auto;
    line-height: 1.5;
    min-height: 100vh;
  }
  h1, h2 { font-family: var(--serif); margin: 0; line-height: 1.1; }
  a { color: var(--brass-lt); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--brass-lt); outline-offset: 2px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 24px;
    border-bottom: 1px solid rgba(176,143,79,0.3);
  }
  .brand {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 1.05rem;
  }
  .brand i { font-style: normal; color: var(--vermilion); }
  .who { display: flex; align-items: center; gap: 14px; font-size: 0.85rem; color: var(--on-ink-dim); }
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    background: none;
    color: var(--brass-lt);
    border: 1px solid var(--brass);
    padding: 8px 16px;
    cursor: pointer;
  }
  .btn:hover { background: var(--brass); color: var(--ink); }
  .btn.primary { background: var(--vermilion); color: var(--stock); border-color: var(--vermilion); }
  .btn.primary:hover { background: var(--vermilion-d); border-color: var(--vermilion-d); }
  .btn:disabled { opacity: 0.55; cursor: default; }

  /* ---------- LOGIN ---------- */
  .login-wrap {
    min-height: calc(100vh - 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--stock);
    color: var(--ink);
    padding: clamp(28px, 6vw, 40px);
    border: 1px solid var(--brass);
  }
  .login-card h1 { font-size: 1.6rem; margin-bottom: 6px; }
  .login-card p.lede { color: var(--on-stock-dim); font-size: 0.9rem; margin: 0 0 22px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
  .field input {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    padding: 10px 12px;
    border: 1px solid rgba(20,24,44,0.3);
    background: #fff;
    color: var(--ink);
  }
  .field input:focus { border-color: var(--vermilion); outline: 2px solid var(--vermilion); outline-offset: 1px; }
  .login-card .btn.primary { width: 100%; margin-top: 6px; }
  .login-error {
    min-height: 1.3em;
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--vermilion-d);
    text-align: center;
  }

  /* ---------- DASHBOARD ---------- */
  .dash { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 1px solid rgba(176,143,79,0.3); }
  .tab {
    font: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    background: none;
    border: 0;
    color: var(--on-ink-dim);
    padding: 10px 4px;
    margin-right: 20px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--stock); border-bottom-color: var(--vermilion); }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  .panel-head h2 { font-size: 1.3rem; }
  .count { font-size: 0.85rem; color: var(--on-ink-dim); }
  .search {
    font: inherit;
    padding: 9px 12px;
    border: 1px solid rgba(176,143,79,0.4);
    background: var(--ink-2);
    color: var(--stock);
    min-width: 220px;
  }
  .error-msg { color: var(--vermilion-d); font-size: 0.88rem; margin: 10px 0; }

  .table-scroll { overflow-x: auto; border: 1px solid rgba(176,143,79,0.3); }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; white-space: nowrap; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(176,143,79,0.18); }
  th { color: var(--brass-lt); font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; background: var(--ink-2); }
  td.note-cell { white-space: normal; max-width: 240px; }
  tr:last-child td { border-bottom: 0; }
  td select {
    font: inherit;
    background: var(--ink-2);
    color: var(--stock);
    border: 1px solid rgba(176,143,79,0.4);
    padding: 5px 8px;
  }
  .row-del {
    font: inherit;
    font-size: 0.8rem;
    background: none;
    border: 1px solid rgba(206,51,39,0.6);
    color: var(--vermilion);
    padding: 5px 10px;
    cursor: pointer;
  }
  .row-del:hover { background: var(--vermilion); color: var(--stock); }
  .empty-row td { color: var(--on-ink-dim); text-align: center; padding: 30px; }

  td .paid-check { width: 18px; height: 18px; accent-color: var(--vermilion); cursor: pointer; }
  td .amount-control { display: flex; flex-direction: column; gap: 4px; }
  td .amount-select,
  td .amount-custom {
    width: 108px;
    font: inherit;
    background: var(--ink-2);
    color: var(--stock);
    border: 1px solid rgba(176,143,79,0.4);
    padding: 5px 7px;
  }
  td .amount-select:focus,
  td .amount-custom:focus { border-color: var(--brass-lt); outline: none; }

  /* ---------- STATISTICS ---------- */
  .stat-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 26px;
  }
  .stat-tile {
    border: 1px solid rgba(176,143,79,0.3);
    padding: 18px 20px;
  }
  .stat-tile-value {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 2rem;
    color: var(--stock);
    line-height: 1;
  }
  .stat-tile-label {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--on-ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .stat-breakdowns {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }
  .breakdown-card {
    border: 1px solid rgba(176,143,79,0.3);
    padding: 16px 18px 18px;
  }
  .breakdown-card h3 {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--brass-lt);
    margin-bottom: 12px;
  }
  .breakdown-empty { font-size: 0.85rem; color: var(--on-ink-dim); margin: 0; }
  .breakdown-row {
    display: grid;
    grid-template-columns: 6.5rem 1fr 2.4rem;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
    margin-bottom: 9px;
  }
  .breakdown-row:last-child { margin-bottom: 0; }
  .breakdown-label { color: var(--on-ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .breakdown-track {
    display: block;
    height: 8px;
    background: rgba(176,143,79,0.15);
    border-radius: 4px;
    overflow: hidden;
  }
  .breakdown-fill { display: block; height: 100%; background: var(--brass); border-radius: 4px; }
  .breakdown-count { text-align: right; color: var(--stock); font-variant-numeric: tabular-nums; }

  .breakdown-total {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(176,143,79,0.4);
  }
  .breakdown-total .breakdown-label,
  .breakdown-total .breakdown-count { color: var(--brass-lt); font-weight: 700; }

  /* ---------- SETTINGS FORM ---------- */
  .settings-form { max-width: 720px; }
  fieldset { border: 1px solid rgba(176,143,79,0.3); padding: 18px 18px 4px; margin: 0 0 20px; }
  legend { padding: 0 8px; font-family: var(--serif); font-weight: 700; color: var(--brass-lt); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .settings-form .field label { color: var(--on-ink-dim); }
  .settings-form .field input,
  .settings-form .field textarea {
    width: 100%;
    font: inherit;
    padding: 9px 11px;
    border: 1px solid rgba(176,143,79,0.4);
    background: var(--ink-2);
    color: var(--stock);
  }
  .settings-form .field textarea { resize: vertical; min-height: 3.5em; }
  .settings-status { font-size: 0.88rem; color: var(--brass-lt); min-height: 1.3em; margin-top: 8px; }

  .event-switch { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .event-switch-label { font-size: 0.85rem; color: var(--on-ink-dim); }
  .event-btn {
    font: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    background: none;
    color: var(--on-ink-dim);
    border: 1px solid rgba(176,143,79,0.4);
    padding: 8px 16px;
    cursor: pointer;
  }
  .event-btn[aria-pressed="true"] { background: var(--brass); color: var(--ink); border-color: var(--brass); }
  .event-btn:hover:not([aria-pressed="true"]) { border-color: var(--brass); color: var(--stock); }

  @media (max-width: 640px) {
    .grid2 { grid-template-columns: 1fr; }
    .who span { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><i>&#9830;</i> xFAF &#8212; organizer</div>
  <div class="who" id="whoBox" hidden>
    <span id="whoami"></span>
    <button class="btn" id="logoutBtn" type="button">Log out</button>
  </div>
</div>

<div class="login-wrap" id="loginView">
  <form class="login-card" id="loginForm" novalidate>
    <h1>Organizer sign-in</h1>
    <p class="lede">Manage both xFAF editions &#8212; registrations, statistics and event details.</p>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn primary" id="loginSubmit">Log in</button>
    <p class="login-error" id="loginError" role="alert"></p>
  </form>
</div>

<div class="dash" id="dashboardView" hidden>
  <div class="event-switch">
    <span class="event-switch-label">Editing:</span>
    <button class="event-btn" data-event="spring-2026" type="button" aria-pressed="true">Spring 2026</button>
    <button class="event-btn" data-event="fall-2026" type="button" aria-pressed="false">Fall 2026</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabRegs" role="tab" aria-selected="true" type="button">Registrations</button>
    <button class="tab" id="tabStats" role="tab" aria-selected="false" type="button">Statistics</button>
    <button class="tab" id="tabSettings" role="tab" aria-selected="false" type="button">Event settings</button>
  </div>

  <section id="panelRegs">
    <div class="panel-head">
      <h2>Registrations</h2>
      <input type="search" class="search" id="regsSearch" placeholder="Search name or contact&#8230;">
    </div>
    <p class="count" id="regsCount"></p>
    <p class="error-msg" id="regsError"></p>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Group</th><th>Contact</th><th>Beer</th><th>Stay</th><th>Food</th><th>Pay by</th><th>Tier</th><th>Note</th><th>Submitted</th><th>Paid</th><th>Amount (lei)</th><th></th>
          </tr>
        </thead>
        <tbody id="regsBody"></tbody>
      </table>
    </div>
    <p style="margin-top:16px;"><button class="btn" id="exportCsv" type="button">Export CSV</button></p>
  </section>

  <section id="panelStats" hidden>
    <div class="panel-head"><h2>Statistics</h2></div>
    <div class="stat-tiles" id="statTiles"></div>
    <div class="stat-breakdowns" id="statBreakdowns"></div>
  </section>

  <section id="panelSettings" hidden>
    <div class="panel-head"><h2>Event settings</h2></div>
    <p class="error-msg" id="settingsError"></p>
    <form class="settings-form" id="settingsForm">
      <fieldset>
        <legend>When &amp; where</legend>
        <div class="field">
          <label for="setEventDate">Event date &amp; time (used by the countdown)</label>
          <input type="datetime-local" id="setEventDate">
        </div>
        <div class="grid2">
          <div class="field"><label for="setHeroDate">Date label</label><input type="text" id="setHeroDate" placeholder="April 25"></div>
          <div class="field"><label for="setHeroDateSub">Date sub-line</label><input type="text" id="setHeroDateSub" placeholder="All night long"></div>
          <div class="field"><label for="setVenueName">Venue name</label><input type="text" id="setVenueName" placeholder="Pensiunea"></div>
          <div class="field"><label for="setVenueSub">Venue sub-line</label><input type="text" id="setVenueSub" placeholder="Vaca&#539;a della Nonna"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Pricing tiers</legend>
        <div id="tierFields"></div>
      </fieldset>

      <fieldset>
        <legend>Group bundle &amp; fine print</legend>
        <div class="field"><label for="setBundleHeadline">Bundle headline</label><input type="text" id="setBundleHeadline"></div>
        <div class="field"><label for="setBundleNote">Bundle note</label><textarea id="setBundleNote" rows="2"></textarea></div>
        <div class="field"><label for="setFinePrint">Fine print</label><textarea id="setFinePrint" rows="2"></textarea></div>
      </fieldset>

      <button type="submit" class="btn primary" id="settingsSave">Save changes</button>
      <p class="settings-status" id="settingsStatus"></p>
    </form>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>

<script>
  const cfg = window.XFAF_FIREBASE_CONFIG;
  const configured = !!(cfg && cfg.apiKey && cfg.apiKey.indexOf('REPLACE_ME') === -1);

  const loginView = document.getElementById('loginView');
  const dashboardView = document.getElementById('dashboardView');
  const whoBox = document.getElementById('whoBox');
  const loginError = document.getElementById('loginError');

  if (!configured) {
    loginError.textContent = 'This site is not connected to a Firebase project yet — nothing to sign into.';
    document.getElementById('loginSubmit').disabled = true;
  } else {
    firebase.initializeApp(cfg);
  }
  const auth = configured ? firebase.auth() : null;
  const db = configured ? firebase.firestore() : null;

  /* ---- which edition is being managed ----------------------------
     each edition's data lives at events/{eventId}/registrations and
     events/{eventId}/settings/event — completely separate from the
     other edition's, switched here rather than by URL */
  let currentEventId = 'spring-2026';
  function eventRef() { return db.collection('events').doc(currentEventId); }

  /* ---- auth ---- */
  if (auth) {
    auth.onAuthStateChanged(function (user) {
      if (user) {
        loginView.hidden = true;
        dashboardView.hidden = false;
        whoBox.hidden = false;
        document.getElementById('whoami').textContent = user.email;
        startRegistrationsListener();
        loadSettingsIntoForm();
      } else {
        dashboardView.hidden = true;
        whoBox.hidden = true;
        loginView.hidden = false;
        stopRegistrationsListener();
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      loginError.textContent = '';
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmit');
      btn.disabled = true;
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        loginError.textContent = 'That email or password is not right.';
      }
      btn.disabled = false;
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
      auth.signOut();
    });
  }

  /* ---- tabs ---- */
  const tabRegs = document.getElementById('tabRegs');
  const tabStats = document.getElementById('tabStats');
  const tabSettings = document.getElementById('tabSettings');
  const panelRegs = document.getElementById('panelRegs');
  const panelStats = document.getElementById('panelStats');
  const panelSettings = document.getElementById('panelSettings');
  tabRegs.addEventListener('click', function () { showTab('regs'); });
  tabStats.addEventListener('click', function () { showTab('stats'); });
  tabSettings.addEventListener('click', function () { showTab('settings'); });
  function showTab(name) {
    tabRegs.setAttribute('aria-selected', String(name === 'regs'));
    tabStats.setAttribute('aria-selected', String(name === 'stats'));
    tabSettings.setAttribute('aria-selected', String(name === 'settings'));
    panelRegs.hidden = name !== 'regs';
    panelStats.hidden = name !== 'stats';
    panelSettings.hidden = name !== 'settings';
  }

  /* ---- event switcher --------------------------------------------
     switching editions tears down the old listener and starts a
     fresh one scoped to the new event's own data */
  document.querySelectorAll('.event-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.dataset.event === currentEventId) return;
      currentEventId = btn.dataset.event;
      document.querySelectorAll('.event-btn').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      liveTiers = (EVENT_DEFAULTS[currentEventId] || EVENT_DEFAULTS['spring-2026']).tiers;
      document.getElementById('regsSearch').value = '';
      stopRegistrationsListener();
      startRegistrationsListener();
      loadSettingsIntoForm();
    });
  });

  /* ---- registrations, live ---- */
  let unsubRegs = null;
  let allRegs = [];

  function startRegistrationsListener() {
    if (unsubRegs || !db) return;
    unsubRegs = eventRef().collection('registrations').orderBy('createdAt', 'desc').onSnapshot(function (snap) {
      document.getElementById('regsError').textContent = '';
      allRegs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      renderRegistrations();
      renderStats();
    }, function (err) {
      document.getElementById('regsError').textContent = 'Could not load registrations (' + err.code + ').';
    });
  }
  function stopRegistrationsListener() {
    if (unsubRegs) { unsubRegs(); unsubRegs = null; }
    allRegs = [];
    renderRegistrations();
    renderStats();
  }

  function renderRegistrations() {
    // pinned once per render so a row's controls always write back to the
    // edition they were rendered under, even if the organizer switches
    // editions before this row's listener fires again
    const regsRef = db ? db.collection('events').doc(currentEventId).collection('registrations') : null;
    const q = document.getElementById('regsSearch').value.trim().toLowerCase();
    const rows = allRegs.filter(function (r) {
      if (!q) return true;
      return (r.name || '').toLowerCase().indexOf(q) !== -1 || (r.contact || '').toLowerCase().indexOf(q) !== -1;
    });
    document.getElementById('regsCount').textContent = rows.length + ' of ' + allRegs.length + ' registrations';

    const tbody = document.getElementById('regsBody');
    tbody.innerHTML = '';
    if (rows.length === 0) {
      const tr = document.createElement('tr');
      tr.className = 'empty-row';
      tr.innerHTML = '<td colspan="13">' + (allRegs.length === 0 ? 'No registrations yet.' : 'Nothing matches that search.') + '</td>';
      tbody.appendChild(tr);
      return;
    }

    const BEER_LABEL = { yes: 'Competing', no: 'Watching' };
    const STAY_LABEL = { yes: 'Staying', no: 'Leaving' };
    const PAY_LABEL = { cash: 'Cash', card: 'Card' };

    rows.forEach(function (r) {
      const tr = document.createElement('tr');
      const when = (r.createdAt && r.createdAt.toDate) ? r.createdAt.toDate().toLocaleString() : '—';
      const foodText = r.food === 'other' ? ('Other: ' + (r.foodOther || '')) : (r.food || '');
      tr.innerHTML =
        '<td>' + escapeHtml(r.name) + '</td>' +
        '<td>' + escapeHtml(r.group) + '</td>' +
        '<td>' + escapeHtml(r.contact) + '</td>' +
        '<td>' + escapeHtml(BEER_LABEL[r.beer] || r.beer) + '</td>' +
        '<td>' + escapeHtml(STAY_LABEL[r.stay] || r.stay) + '</td>' +
        '<td>' + escapeHtml(foodText) + '</td>' +
        '<td>' + escapeHtml(PAY_LABEL[r.payment] || r.payment) + '</td>' +
        '<td>' + escapeHtml(r.tier) + '</td>' +
        '<td class="note-cell">' + escapeHtml(r.note) + '</td>' +
        '<td>' + when + '</td>';

      const suggestedAmount = r.amountPaid || guessTierPrice(r);

      // Amount: pick one of the site's current ticket prices, or type a
      // custom one — built first so the Paid checkbox can read its value.
      const priceOptions = getCurrentPrices();
      const amountSelect = document.createElement('select');
      amountSelect.className = 'amount-select';
      amountSelect.setAttribute('aria-label', 'Amount for ' + (r.name || 'this registration'));
      priceOptions.forEach(function (price) {
        const opt = document.createElement('option');
        opt.value = String(price);
        opt.textContent = price + ' lei';
        amountSelect.appendChild(opt);
      });
      const customOpt = document.createElement('option');
      customOpt.value = 'custom';
      customOpt.textContent = 'Custom…';
      amountSelect.appendChild(customOpt);

      const customInput = document.createElement('input');
      customInput.type = 'number';
      customInput.className = 'amount-custom';
      customInput.min = '0';
      customInput.step = '1';
      customInput.placeholder = 'lei';
      customInput.hidden = true;

      const startAmount = r.amountPaid || suggestedAmount || 0;
      if (startAmount && priceOptions.indexOf(startAmount) !== -1) {
        amountSelect.value = String(startAmount);
      } else if (startAmount) {
        amountSelect.value = 'custom';
        customInput.hidden = false;
        customInput.value = String(startAmount);
      } else if (priceOptions.length) {
        amountSelect.value = String(priceOptions[0]); // a default to start from, not yet saved
      }

      function currentAmountValue() {
        if (amountSelect.value === 'custom') return Math.max(0, Number(customInput.value) || 0);
        return Number(amountSelect.value) || 0;
      }

      amountSelect.addEventListener('change', function () {
        if (amountSelect.value === 'custom') {
          customInput.hidden = false;
          customInput.focus();
          return; // wait for an actual number before saving anything
        }
        customInput.hidden = true;
        regsRef.doc(r.id).update({ amountPaid: Number(amountSelect.value) || 0 })
          .catch(function () {});
      });
      customInput.addEventListener('change', function () {
        const val = Math.max(0, Number(customInput.value) || 0);
        customInput.value = val ? String(val) : '';
        regsRef.doc(r.id).update({ amountPaid: val }).catch(function () {});
      });

      const paidTd = document.createElement('td');
      const paidCheck = document.createElement('input');
      paidCheck.type = 'checkbox';
      paidCheck.className = 'paid-check';
      paidCheck.checked = !!r.paid;
      paidCheck.setAttribute('aria-label', 'Mark ' + (r.name || 'this registration') + ' as paid');
      paidCheck.addEventListener('change', function () {
        // checking "Paid" with no amount recorded yet saves whatever the
        // amount control is currently showing, so this is usually one click
        const update = { paid: paidCheck.checked };
        if (paidCheck.checked && !r.amountPaid) {
          const val = currentAmountValue();
          if (val) update.amountPaid = val;
        }
        regsRef.doc(r.id).update(update).catch(function () {
          paidCheck.checked = !!r.paid;
        });
      });
      paidTd.appendChild(paidCheck);
      tr.appendChild(paidTd);

      const amountTd = document.createElement('td');
      const amountWrap = document.createElement('div');
      amountWrap.className = 'amount-control';
      amountWrap.appendChild(amountSelect);
      amountWrap.appendChild(customInput);
      amountTd.appendChild(amountWrap);
      tr.appendChild(amountTd);

      const delTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'row-del';
      delBtn.textContent = 'Remove';
      delBtn.addEventListener('click', function () {
        if (confirm('Remove ' + (r.name || 'this registration') + '?')) {
          regsRef.doc(r.id).delete();
        }
      });
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);

      tbody.appendChild(tr);
    });
  }

  /* ---- statistics ---- */
  function renderStats() {
    const total = allRegs.length;
    const paidCount = allRegs.filter(function (r) { return !!r.paid; }).length;
    // only rows actually marked Paid count toward money in hand — an
    // amount left over from before someone unchecked Paid should not
    const totalCollected = allRegs.reduce(function (sum, r) { return sum + (r.paid ? (Number(r.amountPaid) || 0) : 0); }, 0);

    const tiles = [
      { value: String(total), label: 'Registrations' },
      { value: String(paidCount), label: 'Paid' },
      { value: String(total - paidCount), label: 'Not paid yet' },
      { value: totalCollected + ' lei', label: 'Collected' }
    ];
    const tilesEl = document.getElementById('statTiles');
    tilesEl.innerHTML = '';
    tiles.forEach(function (t) {
      const div = document.createElement('div');
      div.className = 'stat-tile';
      div.innerHTML = '<div class="stat-tile-value">' + escapeHtml(t.value) + '</div><div class="stat-tile-label">' + escapeHtml(t.label) + '</div>';
      tilesEl.appendChild(div);
    });

    const breakdownsEl = document.getElementById('statBreakdowns');
    breakdownsEl.innerHTML = '';
    breakdownsEl.appendChild(buildBreakdown('By cohort', countByCohort(allRegs), total, { showTotal: true }));
    breakdownsEl.appendChild(buildBreakdown('By pricing tier', countBy(allRegs, 'tier', null), total));
    breakdownsEl.appendChild(buildBreakdown('By payment method', countBy(allRegs, 'payment', { cash: 'Cash', card: 'Card' }), total));
    breakdownsEl.appendChild(buildBreakdown('Beerlympics', countBy(allRegs, 'beer', { yes: 'Competing', no: 'Watching' }), total));
    breakdownsEl.appendChild(buildBreakdown('Staying the night', countBy(allRegs, 'stay', { yes: 'Staying', no: 'Leaving' }), total));
    breakdownsEl.appendChild(buildBreakdown('Food preference', countBy(allRegs, 'food', { none: 'None', vegetarian: 'Vegetarian', vegan: 'Vegan', other: 'Other' }), total));
  }

  function countBy(rows, field, labels) {
    const counts = {};
    rows.forEach(function (r) {
      const raw = r[field];
      if (raw == null || raw === '') return;
      counts[raw] = (counts[raw] || 0) + 1;
    });
    return Object.keys(counts)
      .map(function (key) { return { label: (labels && labels[key]) || key, count: counts[key] }; })
      .sort(function (a, b) { return b.count - a.count; });
  }

  /* groups "FAF-253" into the cohort "FAF-25X" — the first two digits
     of the group code, the way the old spreadsheet's "Torent" column did */
  function cohortOf(group) {
    const m = String(group || '').trim().match(/^([A-Za-z]+-?)?(\d{2})/);
    if (!m) return 'Other';
    return (m[1] || '') + m[2] + 'X';
  }
  function countByCohort(rows) {
    const counts = {};
    rows.forEach(function (r) {
      if (!r.group || !String(r.group).trim()) return;
      const key = cohortOf(r.group);
      counts[key] = (counts[key] || 0) + 1;
    });
    return Object.keys(counts)
      .sort()
      .map(function (key) { return { label: key, count: counts[key] }; });
  }

  function buildBreakdown(title, items, total, opts) {
    const card = document.createElement('div');
    card.className = 'breakdown-card';
    const h3 = document.createElement('h3');
    h3.textContent = title;
    card.appendChild(h3);
    if (items.length === 0 || total === 0) {
      const p = document.createElement('p');
      p.className = 'breakdown-empty';
      p.textContent = 'No data yet.';
      card.appendChild(p);
      return card;
    }
    const peak = items.reduce(function (m, it) { return Math.max(m, it.count); }, 0);
    items.forEach(function (item) {
      const pct = peak ? Math.round((item.count / peak) * 100) : 0;
      const row = document.createElement('div');
      row.className = 'breakdown-row';
      row.innerHTML =
        '<span class="breakdown-label">' + escapeHtml(item.label) + '</span>' +
        '<span class="breakdown-track"><span class="breakdown-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="breakdown-count">' + item.count + '</span>';
      card.appendChild(row);
    });
    if (opts && opts.showTotal) {
      const sum = items.reduce(function (s, it) { return s + it.count; }, 0);
      const row = document.createElement('div');
      row.className = 'breakdown-row breakdown-total';
      row.innerHTML =
        '<span class="breakdown-label">Total</span>' +
        '<span class="breakdown-track"></span>' +
        '<span class="breakdown-count">' + sum + '</span>';
      card.appendChild(row);
    }
    return card;
  }
  document.getElementById('regsSearch').addEventListener('input', renderRegistrations);

  document.getElementById('exportCsv').addEventListener('click', function () {
    const header = ['Name', 'Group', 'Contact', 'Beerlympics', 'Staying', 'Food', 'Payment', 'Tier', 'Note', 'Paid', 'Amount (lei)', 'Submitted'];
    const lines = [header.map(csvCell).join(',')];
    allRegs.forEach(function (r) {
      const when = (r.createdAt && r.createdAt.toDate) ? r.createdAt.toDate().toISOString() : '';
      const foodText = r.food === 'other' ? ('Other: ' + (r.foodOther || '')) : (r.food || '');
      lines.push([
        r.name, r.group, r.contact, r.beer, r.stay, foodText, r.payment, r.tier, r.note,
        r.paid ? 'Yes' : 'No', r.amountPaid || 0, when
      ].map(csvCell).join(','));
    });
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'xfaf-registrations.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  function csvCell(v) {
    const s = v == null ? '' : String(v);
    return '"' + s.replace(/"/g, '""') + '"';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---- event settings ---- */
  // starting point for each edition until the organizer saves real
  // settings for it — Fall's are placeholders (no eventDate at all,
  // so the public page never shows a made-up countdown target)
  const EVENT_DEFAULTS = {
    'spring-2026': {
      eventDate: '2027-04-25T16:00:00',
      dateLabel: 'April 25', dateSub: 'All night long',
      venueName: 'Pensiunea', venueSub: 'Vacața della Nonna',
      tiers: [
        { name: 'The Early Ante', dateLabel: 'March 30 – April 7', from: '03-30', to: '04-07', opens: 'March 30', price: 400 },
        { name: 'The Main Action', dateLabel: 'April 8 – April 22', from: '04-08', to: '04-22', opens: 'April 8', price: 450 },
        { name: 'The Final Spin', dateLabel: 'April 23 – April 25', from: '04-23', to: '04-25', opens: 'April 23', price: 500 }
      ],
      bundleHeadline: 'Bring your crew.',
      bundleNote: 'Register as a group of 4 and pay 400 lei each, or as a group of 3 and pay 425 lei each.',
      finePrint: 'Your price is set by the day you actually pay, not the day you register. Register as soon as you can so we know to expect you, then send payment before the next step.'
    },
    'fall-2026': {
      eventDate: '',
      dateLabel: 'TBA', dateSub: 'Autumn 2026',
      venueName: 'TBA', venueSub: 'Location to be announced',
      tiers: [
        { name: 'Early Bird', dateLabel: 'September 1 – September 30', from: '09-01', to: '09-30', opens: 'September 1', price: 350 },
        { name: 'Standard', dateLabel: 'October 1 – October 20', from: '10-01', to: '10-20', opens: 'October 1', price: 400 },
        { name: 'Last Call', dateLabel: 'October 21 – November 1', from: '10-21', to: '11-01', opens: 'October 21', price: 450 }
      ],
      bundleHeadline: 'Bring your crew.',
      bundleNote: 'Group pricing will be announced with the rest of the details.',
      finePrint: 'These prices and dates are placeholders until the organizer confirms the real ones.'
    }
  };
  // updated once the organizer's saved settings load, so the amount
  // guess below reflects real prices rather than always the defaults
  let liveTiers = EVENT_DEFAULTS[currentEventId].tiers;

  // best-effort ticket price for a registration, so marking it "Paid"
  // can fill in the amount instead of making you type it every time
  function guessTierPrice(r) {
    if (r.tierPrice) return r.tierPrice;
    if (!r.tier) return 0;
    const match = liveTiers.find(function (t) { return t.name === r.tier; });
    return match ? match.price : 0;
  }

  // the site's current ticket prices, for the Amount dropdown — de-duped
  // and sorted, so "Custom…" is only needed for a genuine one-off amount
  function getCurrentPrices() {
    const seen = {};
    liveTiers.forEach(function (t) { if (t.price) seen[t.price] = true; });
    return Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
  }

  const tierFields = document.getElementById('tierFields');
  EVENT_DEFAULTS['spring-2026'].tiers.forEach(function (_, i) {
    const wrap = document.createElement('div');
    wrap.className = 'grid2';
    wrap.style.marginBottom = '14px';
    wrap.innerHTML =
      '<div class="field"><label for="tier' + i + 'Name">Tier name</label><input type="text" id="tier' + i + 'Name"></div>' +
      '<div class="field"><label for="tier' + i + 'Price">Price (lei)</label><input type="number" id="tier' + i + 'Price" min="0" step="1"></div>' +
      '<div class="field"><label for="tier' + i + 'From">Starts</label><input type="date" id="tier' + i + 'From"></div>' +
      '<div class="field"><label for="tier' + i + 'To">Ends</label><input type="date" id="tier' + i + 'To"></div>';
    tierFields.appendChild(wrap);
  });

  /* the public page only ever shows month + day ("March 30"), so the
     tier pickers just need a date to click — the display text and the
     "opens" label are generated from it instead of typed by hand */
  function monthDay(isoDate) {
    if (!isoDate) return '';
    const parts = isoDate.split('-');
    const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  }
  function toMonthDayCode(isoDate) {
    return isoDate ? isoDate.slice(5) : ''; // "2027-03-30" -> "03-30"
  }

  function setVal(id, v) { const el = document.getElementById(id); if (el && v != null) el.value = v; }
  function getVal(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  async function loadSettingsIntoForm() {
    if (!db) return;
    const thisEventId = currentEventId; // guard against a switch mid-fetch
    const defaults = EVENT_DEFAULTS[thisEventId] || EVENT_DEFAULTS['spring-2026'];
    document.getElementById('settingsError').textContent = '';
    try {
      const snap = await eventRef().collection('settings').doc('event').get();
      if (thisEventId !== currentEventId) return; // organizer switched away while this was loading
      const s = snap.exists ? snap.data() : {};

      const eventDateVal = s.eventDate != null ? s.eventDate : defaults.eventDate;
      setVal('setEventDate', eventDateVal ? eventDateVal.slice(0, 16) : '');
      setVal('setHeroDate', s.dateLabel || defaults.dateLabel);
      setVal('setHeroDateSub', s.dateSub || defaults.dateSub);
      setVal('setVenueName', s.venueName || defaults.venueName);
      setVal('setVenueSub', s.venueSub || defaults.venueSub);

      // the pickers need a full date; tiers are stored without a year
      // (they're assumed to fall in the event's own year), so borrow one
      // — the event's own year if it has a date yet, else the current year
      const tierYear = eventDateVal ? new Date(eventDateVal).getFullYear() : new Date().getFullYear();
      const tiers = (Array.isArray(s.tiers) && s.tiers.length === 3) ? s.tiers : defaults.tiers;
      liveTiers = tiers;
      renderRegistrations(); // refresh any amount placeholders now that real prices are known
      tiers.forEach(function (t, i) {
        setVal('tier' + i + 'Name', t.name);
        setVal('tier' + i + 'Price', t.price);
        setVal('tier' + i + 'From', t.from ? (tierYear + '-' + t.from) : '');
        setVal('tier' + i + 'To', t.to ? (tierYear + '-' + t.to) : '');
      });

      setVal('setBundleHeadline', s.bundleHeadline || defaults.bundleHeadline);
      setVal('setBundleNote', s.bundleNote || defaults.bundleNote);
      setVal('setFinePrint', s.finePrint || defaults.finePrint);
    } catch (err) {
      document.getElementById('settingsError').textContent = 'Could not load current settings (' + err.code + ').';
    }
  }

  document.getElementById('settingsForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('settingsSave');
    const status = document.getElementById('settingsStatus');
    btn.disabled = true;
    status.textContent = 'Saving…';

    const tiers = [0, 1, 2].map(function (i) {
      const from = getVal('tier' + i + 'From'); // "2027-03-30"
      const to = getVal('tier' + i + 'To');
      return {
        name: getVal('tier' + i + 'Name'),
        price: Number(getVal('tier' + i + 'Price')) || 0,
        dateLabel: monthDay(from) + ' – ' + monthDay(to),
        opens: monthDay(from),
        from: toMonthDayCode(from),
        to: toMonthDayCode(to)
      };
    });

    const eventDateInput = getVal('setEventDate');
    const data = {
      // an empty field saves as "" on purpose — the public page then shows
      // "date to be announced" instead of a countdown to a made-up date
      eventDate: eventDateInput ? eventDateInput + ':00' : '',
      dateLabel: getVal('setHeroDate'),
      dateSub: getVal('setHeroDateSub'),
      venueName: getVal('setVenueName'),
      venueSub: getVal('setVenueSub'),
      tiers: tiers,
      bundleHeadline: getVal('setBundleHeadline'),
      bundleNote: getVal('setBundleNote'),
      finePrint: getVal('setFinePrint')
    };

    try {
      await eventRef().collection('settings').doc('event').set(data, { merge: true });
      status.textContent = 'Saved. The public page picks this up on its next visit.';
    } catch (err) {
      status.textContent = 'Could not save (' + err.code + ').';
    }
    btn.disabled = false;
  });
</script>
